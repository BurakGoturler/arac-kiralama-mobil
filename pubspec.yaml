name: car_rental_mvp
description: Premium Car Rental MVP – frictionless WhatsApp-based reservations.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0' # Daha geniş bir SDK aralığına güncellendi

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  font_awesome_flutter: ^10.7.0
  url_launcher: ^6.3.0
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7

  # ── Firebase (YENİ) ──
  firebase_core: ^3.12.1
  cloud_firestore: ^5.5.0
  firebase_auth: ^5.5.1
  firebase_storage: ^12.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/