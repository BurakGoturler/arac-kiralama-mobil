name: car_rental_mvp
description: Premium Car Rental MVP – frictionless WhatsApp-based reservations.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0' # Daha geniş bir SDK aralığına güncellendi

dependencies:
  flutter:
    sdk: flutter
  # Material/Cupertino widget'larının Türkçe metinleri için. Bu paket
  # olmadan takvim ve saat seçici İngilizce açılıyordu ("Select date",
  # "September 2026", "Cancel/OK") — uygulamanın geri kalanı Türkçeyken.
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # flutter_svg, lottie ve font_awesome_flutter kaldırıldı —
  # kod tabanında hiçbir yerde kullanılmıyorlardı, yalnızca uygulama
  # boyutunu ve derleme süresini artırıyorlardı.
  url_launcher: ^6.3.0
  intl: ^0.20.2
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7

  # ── Firebase (YENİ) ──
  firebase_core: ^3.12.1
  cloud_firestore: ^5.5.0
  firebase_auth: ^5.5.1
  firebase_storage: ^12.4.1
  # App Check kurulmadığında Firestore/Storage her istekte
  # "No AppCheckProvider installed" uyarısı basar ve yer tutucu token gönderir.
  firebase_app_check: ^0.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  uses-material-design: true
  # Araç görselleri artık Firebase Storage'dan URL ile geliyor.
  # assets/images/ klasörünün tamamını pakete koymak, kullanılmayan
  # 25 araç fotoğrafını (~12 MB) uygulamaya gereksiz yere ekliyordu.
  # Dosyalar diskte duruyor, yalnızca pakete dahil edilmiyorlar.
  assets:
    - assets/images/logo.png
    - assets/images/logo-uzun.png

  # Yazı tipleri pakete gömülü (SIL Open Font License). Ağırlıklar
  # kodda kullanılanlarla sınırlı.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    - family: DMSerifDisplay
      fonts:
        - asset: assets/fonts/DMSerifDisplay-Regular.ttf